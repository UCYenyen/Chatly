services:
  chatly_web:
    container_name: chatly_prod_app
    image: ghcr.io/ucyenyen/chatly:latest
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_APP_URL
      - BETTER_AUTH_SECRET
      - XENDIT_CALLBACK_TOKEN
      - BETTER_AUTH_URL
      - GMAIL_USER
      - GMAIL_APP_PASSWORD
      - DATABASE_URL
      - NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME
      - CLOUDINARY_API_KEY
      - CLOUDINARY_API_SECRET
      - XENDIT_SECRET_KEY
      - NEXT_PUBLIC_XENDIT_KEY
      - GEMINI_API_KEY
      - GOWA_API_BASE
      - GOWA_BASIC_AUTH_USER
      - GOWA_BASIC_AUTH_PASS
      - GOWA_WEBHOOK_SECRET
    env_file:
      - .env
    networks:
      - global_proxy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  prisma_studio:
    image: node:20-alpine
    container_name: chatly_prisma_studio
    restart: on-failure
    working_dir: /app
    volumes:
      - ./:/app
      - /app/node_modules
    environment:
      - DATABASE_URL=${DATABASE_URL}
    env_file:
      - .env
    networks:
      - global_proxy
    ports:
      - "5555:5555"
    command: sh -c "corepack enable pnpm && pnpm prisma studio"
    depends_on:
      chatly_web:
        condition: service_healthy
    profiles:
      - dev

networks:
  global_proxy:
    external: true
